# GymBro - {name} ({slug}). Generado por scripts/gymctl.py: el contenedor gymbro-{slug}
# escucha en 127.0.0.1:{port}. certbot agrega el bloque HTTPS al emitir el certificado.
server {
    listen 80;
    listen [::]:80;
    server_name {domain};

    client_max_body_size 16M;

    # Gimnasio suspendido o en mantenimiento: el contenedor está detenido.
    error_page 502 503 504 /suspendido.html;
    location = /suspendido.html {
        root /opt/gymbro-saas/static;
        internal;
    }

    # Assets con hash de Vite: cache larga.
    location /assets/ {
        proxy_pass http://127.0.0.1:{port};
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker y manifest siempre frescos (PWA autoUpdate).
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        proxy_pass http://127.0.0.1:{port};
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:{port};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
