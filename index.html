<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GymBro</title>
    <meta name="description" content="Sistema de gestión integral para gimnasios, control de cuotas, rutinas de entrenamiento y portal interactivo para alumnos y entrenadores." />
    
    <!-- OpenGraph Social Cards (WhatsApp, Facebook, LinkedIn, iMessage) -->
    <meta property="og:title" content="GymBro" />
    <meta property="og:description" content="Sistema de gestión integral para gimnasios, control de cuotas, rutinas de entrenamiento y portal interactivo para alumnos y entrenadores." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GymBro" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="GymBro Logo" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GymBro" />

    <meta name="twitter:image" content="/pwa-512x512.png" />

    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="alternate icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <body class="bg-neutral-950 text-neutral-100 min-h-screen antialiased selection:bg-lime-400 selection:text-neutral-950 font-sans">
