<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a3e635" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#262626" stroke-width="4" />
  
  <!-- Stylized GymBro Dumbbell Icon -->
  <g transform="translate(256, 256) rotate(-45)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="-140" y="-18" width="280" height="36" rx="10" fill="#f5f5f5" />
    <!-- Center knurling rings -->
    <line x1="-50" y1="-16" x2="-50" y2="16" stroke="#a3a3a3" stroke-width="4" />
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#a3a3a3" stroke-width="4" />
    <line x1="50" y1="-16" x2="50" y2="16" stroke="#a3a3a3" stroke-width="4" />

    <!-- Left Plates -->
    <!-- Inner collar -->
    <rect x="-120" y="-36" width="16" height="72" rx="6" fill="#a3a3a3" />
    <!-- Plate 1 (Medium) -->
    <rect x="-152" y="-76" width="26" height="152" rx="10" fill="url(#limeGrad)" />
    <!-- Plate 2 (Large) -->
    <rect x="-186" y="-108" width="28" height="216" rx="12" fill="url(#limeGrad)" stroke="#171717" stroke-width="3" />
    <!-- Outer lock collar -->
    <rect x="-198" y="-28" width="10" height="56" rx="4" fill="#d4d4d4" />

    <!-- Right Plates -->
    <!-- Inner collar -->
    <rect x="104" y="-36" width="16" height="72" rx="6" fill="#a3a3a3" />
    <!-- Plate 1 (Medium) -->
    <rect x="126" y="-76" width="26" height="152" rx="10" fill="url(#limeGrad)" />
    <!-- Plate 2 (Large) -->
    <rect x="158" y="-108" width="28" height="216" rx="12" fill="url(#limeGrad)" stroke="#171717" stroke-width="3" />
    <!-- Outer lock collar -->
    <rect x="188" y="-28" width="10" height="56" rx="4" fill="#d4d4d4" />
  </g>
</svg>
